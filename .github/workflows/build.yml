name: Build Nesca (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_mingw81'
          tools: 'mingw81_64'
          cache: true

      - name: Install libssh (via vcpkg)
        run: |
          vcpkg install libssh:x64-mingw-static
        shell: cmd

      - name: Configure (qmake)
        run: |
          qmake nesca.pro
        shell: cmd

      - name: Build (mingw32-make)
        run: |
          mingw32-make -j4
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: |
            release/*.exe
            *.exe
          if-no-files-found: warn
