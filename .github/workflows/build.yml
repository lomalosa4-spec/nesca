name: Build Nesca
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qtmultimedia5-dev libqt5multimediawidgets5 \
            libqt5multimedia5-plugins libqt5multimedia5 libssh-dev libssl-dev qtbase5-dev
      - name: Build
        run: |
          qmake nesca.pro || qmake nesca_3.pro || qmake
          make -j4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-build
          path: |
            nesca
            nesca_3
