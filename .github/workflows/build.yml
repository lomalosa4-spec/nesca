name: Build Nesca (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_mingw81'
          cache: true

      - name: Setup vcpkg (built-in)
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install libssh via vcpkg
        run: |
          vcpkg install libssh:x64-mingw-dynamic
        shell: cmd

      - name: Configure (qmake)
        run: |
          qmake nesca.pro
        shell: cmd

      - name: Build (mingw32-make)
        run: |
          mingw32-make -j4
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesca-windows
          path: |
            release/*.exe
            *.exe
          if-no-files-found: warn
